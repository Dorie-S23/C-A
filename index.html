<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CGV Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      height: 100%;
      font-family: sans-serif;
    }
    canvas { display: block; }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      cursor: pointer;
      z-index: 10;
      text-align: center;
    }
    #overlay h1 { margin: 0 0 0.5em; }
    #overlay p { margin: 0.2em; opacity: 0.8; }
    #overlay.hidden { display: none; }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      margin: -3px 0 0 -3px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.8;
      pointer-events: none;
      z-index: 5;
    }

    #credits {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 10, 0.95);
      color: #eee;
      z-index: 20;
      overflow-y: auto;
      padding: 2em;
      box-sizing: border-box;
    }
    #credits.hidden { display: none; }
    #credits ul { line-height: 1.6; }
    #credits-close {
      position: fixed;
      top: 1em;
      right: 1.5em;
      font-size: 1.5em;
      color: #fff;
      cursor: pointer;
      z-index: 21;
    }
    #credits-btn {
      position: fixed;
      bottom: 1em;
      right: 1em;
      z-index: 6;
      color: #fff;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      padding: 0.4em 0.8em;
      font-size: 0.85em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <h1>Click to Play</h1>
    <p>WASD / Arrow keys to move, mouse to look, Shift to sprint</p>
    <p>Esc to release the mouse</p>
  </div>
  <div id="crosshair" hidden></div>
  <button id="credits-btn">Credits</button>

  <div id="credits" class="hidden">
    <span id="credits-close">&times;</span>
    <h2>Credits</h2>
    <ul>
      <li><a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a> &mdash; MIT License</li>
    </ul>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
